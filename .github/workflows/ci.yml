# Quality gate: the same checks as `npm run verify`, on every push and pull request.
# Actions are pinned to full commit SHAs (supply-chain hardening) and the token is read-only.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Tests · OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes layer boundaries)
        run: npm run lint

      - name: Tests with coverage thresholds
        run: npm run test:coverage -- --ci

      - name: OpenSpec validate (strict)
        run: npm run spec:validate

      - name: Dependency audit (production deps, informative)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
